<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Document</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
        }

        button {
            font-size: 20px;
            padding: 12px 20px;
            border: none;
            background-color: royalblue;
            color: white;
            border-radius: 10px;
            margin: 5px;
        }

        select {
            font-size: 18px;
            padding: 10px 12px;
            border-radius: 8px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <div id="hud">
        <select id="animationSelect">
            <option value="none" selected>アニメーションなし</option>
        </select>

        <br>

        <button id="enlargeButton">拡大</button>
        <button id="shrinkButton">縮小</button>
        <button id="rotateButton">回転</button>
        <button id="reverseButton">逆回転</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam">

        <a-marker preset="hiro" smooth="true">

            <a-entity
                id="model"
                position="0 0 0.5"
                scale="1 1 1">

                <a-gltf-model
                    id="shiba"
                    src="Shiba Inu.glb"
                    position="0 0 0.5"
                    scale="0.3 0.3 0.3"
                    rotation="-90 0 0">
                </a-gltf-model>
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const shiba = document.getElementById("shiba");
        const animationSelect = document.getElementById("animationSelect");
        const model = document.getElementById("model");

        const enlargeButton = document.getElementById("enlargeButton");
        const shrinkButton = document.getElementById("shrinkButton");
        const rotateButton = document.getElementById("rotateButton");
        const reverseButton = document.getElementById("reverseButton");

        let size = 1;
        let angle = 0;

        shiba.addEventListener("model-loaded", function () {
            const object = shiba.getObject3D("mesh");

            animationSelect.innerHTML = "";

            const animations = object.animations || [];

            if (animations.length === 0) {
                const option = document.createElement("option");
                option.value = "none";
                option.textContent = "アニメーションなし";
                animationSelect.appendChild(option);
                return;
            }

            animations.forEach(function (animation) {
                const option = document.createElement("option");
                option.value = animation.name;
                option.textContent = animation.name;
                animationSelect.appendChild(option);
            });

            animationSelect.value = animations[0].name;
            shiba.setAttribute("animation-mixer", {
                clip: animations[0].name
            });
        });

        enlargeButton.addEventListener("click", function () {
            size = Math.min(size + 0.1, 3);
            model.setAttribute("scale", `${size} ${size} ${size}`);
        });

        shrinkButton.addEventListener("click", function () {
            size = Math.max(size - 0.1, 0.2);
            model.setAttribute("scale", `${size} ${size} ${size}`);
        });

        rotateButton.addEventListener("click", function () {
            angle += 15;
            model.setAttribute("rotation", `0 ${angle} 0`);
        });

        reverseButton.addEventListener("click", function () {
            angle -= 15;
            model.setAttribute("rotation", `0 ${angle} 0`);
        });

        animationSelect.addEventListener("change", function () {
            const selectedAnimation = animationSelect.value;

            if (selectedAnimation === "none") {
                shiba.removeAttribute("animation-mixer");
            } else {
                shiba.setAttribute("animation-mixer", {
                    clip: selectedAnimation
                });
            }
        });
    </script>
</body>
</html>
