<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Exhibition</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>

<a-scene
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <a-sky color="darkgray"></a-sky>

    <a-plane
        rotation="-90 0 0"
        width="12"
        height="12"
        color="gray">
    </a-plane>

    <a-cylinder
        position="-3 0.3 -4"
        radius="1.2"
        height="0.6"
        color="darkgray">
    </a-cylinder>

    <a-octahedron
        id="crystal1"
        class="clickable"
        position="-3 2 -4"
        radius="0.7"
        scale="1 2 1"
        color="blue"

        animation="
        property:position;
        to:-3 2.5 -4;
        loop:true;
        dir:alternate;
        easing:easeInOutSine;
        dur:3000;">
    </a-octahedron>

    <a-cylinder
        position="0 0.3 -5"
        radius="1.5"
        height="0.6"
        color="darkgray">
    </a-cylinder>

    <a-octahedron
        id="crystal2"
        class="clickable"
        position="0 2.2 -5"
        radius="0.8"
        scale="1 2.2 1"
        color="purple"

        animation="
        property:position;
        to:0 2.8 -5;
        loop:true;
        dir:alternate;
        easing:easeInOutSine;
        dur:2500;">
    </a-octahedron>

    <a-cylinder
        position="3 0.3 -4"
        radius="1.2"
        height="0.6"
        color="darkgray">
    </a-cylinder>

    <a-octahedron
        id="crystal3"
        class="clickable"
        position="3 2 -4"
        radius="0.7"
        scale="1 2 1"
        color="red"

        animation="
        property:position;
        to:3 2.5 -4;
        loop:true;
        dir:alternate;
        easing:easeInOutSine;
        dur:3500;">
    </a-octahedron>

    <a-torus
        position="-3 1 -4"
        radius="1"
        radius-tubular="0.03"
        rotation="90 0 0"
        color="cyan"

        animation="
        property:rotation;
        to:90 360 0;
        loop:true;
        easing:linear;
        dur:4000;">
    </a-torus>

    <a-torus
        position="0 1.2 -5"
        radius="1.2"
        radius-tubular="0.03"
        rotation="90 0 0"
        color="violet"

        animation="
        property:rotation;
        to:90 -360 0;
        loop:true;
        easing:linear;
        dur:3500;">
    </a-torus>

    <a-torus
        position="3 1 -4"
        radius="1"
        radius-tubular="0.03"
        rotation="90 0 0"
        color="orange"

        animation="
        property:rotation;
        to:90 360 0;
        loop:true;
        easing:linear;
        dur:4500;">
    </a-torus>

    <a-light
        type="ambient"
        color="white"
        intensity="0.6">
    </a-light>

    <a-light
        type="point"
        position="0 4 -3"
        color="white"
        intensity="2">
    </a-light>

    <a-camera
        position="0 2 4">
    </a-camera>

</a-scene>

<script>

    const crystal1 =
        document.getElementById("crystal1");

    const crystal2 =
        document.getElementById("crystal2");

    const crystal3 =
        document.getElementById("crystal3");

    crystal1.addEventListener("click", function() {
        crystal1.setAttribute("color", "cyan");
        crystal1.setAttribute(
            "animation__rotate",
            "property:rotation;to:0 360 0; dur:1000; easing:easeInOutQuad;"
        );
    });

    crystal2.addEventListener("click", function() {
        crystal2.setAttribute("color", "magenta");
        crystal2.setAttribute(
            "animation__rotate",
            "property:rotation; to:360 360 0; dur:1000; easing:easeInOutQuad;"
        );
    });

    crystal3.addEventListener("click", function() {
        crystal3.setAttribute("color", "orange");
        crystal3.setAttribute(
            "animation__rotate",
            "property:rotation; to:0 -360 0; dur:1000; easing:easeInOutQuad;"
        );
    });
    
</script>
</body>
</html>
