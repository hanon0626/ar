<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <a-octahedron
            position="0 2 -3"
            radius="0.7"
            scale="1 2 1"
            color="blue"

            animation="
            property:r;
            to:0 360 0;
            loop:true;
            easing:linear;
            dur:10000;"
            >
        </a-octahedron>

        <a-cylinder
            position="0 0.15 -3"
            radius="1"
            height="0.3"
            color="dimgray">
        </a-cylinder>
    </a-scene>
</body>
</html>
